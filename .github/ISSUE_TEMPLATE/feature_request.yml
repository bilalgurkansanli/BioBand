name: Feature request
description: Suggest an instrument, song, or improvement
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: |
        Describe the situation rather than the solution. Knowing what you were
        trying to achieve often leads somewhere better than the first idea.
      placeholder: |
        I practise scales daily and lose track of which ones I have covered
        this week.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - A new instrument
        - A new song or tutorial
        - An existing instrument's sound or feel
        - Tutorial Mode / play-along
        - Studio
        - Recordings
        - Profile / progress
        - Localisation
        - Something else
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Anything you have tried or considered
      description: Workarounds you use today, or other approaches you weighed.

  - type: checkboxes
    id: song-rights
    attributes:
      label: If you are requesting a song
      options:
        - label: I understand only songs that can be legally distributed can be added (public domain, or an original transcription that is cleared for use).
